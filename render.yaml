databases:
  - name: hpf-db
    databaseName: hpf
    user: hpf

services:
  - type: web
    name: hpf
    runtime: python
    buildCommand: pip install -r requirements.txt && python Health_Planet/manage.py collectstatic --noinput
    startCommand: python Health_Planet/manage.py migrate --noinput && gunicorn --chdir Health_Planet Health_Planet.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hpf-db
          property: connectionString
