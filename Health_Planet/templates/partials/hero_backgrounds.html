{% load static %}
<div class="hero-bg-carousel" aria-hidden="true">
    {% if hero_slides %}
    {% for slide in hero_slides %}
    {% if slide.image_url %}
    <span style="--hero-slide-bg: url('{{ slide.image_url }}');"></span>
    {% endif %}
    {% endfor %}
    {% elif primary_image %}
    <span style="--hero-slide-bg: url('{{ primary_image }}');"></span>
    {% else %}
    <span style="--hero-slide-bg: url('{% static 'images/im-01.jpeg' %}');"></span>
    {% endif %}
</div>
